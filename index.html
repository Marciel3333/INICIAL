<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sua Empresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Estilos simplificados para o exemplo */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body{ background:#f5f7fb; color:#1e293b; line-height:1.6; }
    header{ width:100%; background:#0f172a; padding:20px 8%; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:999; }
    .logo{ color:#fff; font-size:28px; font-weight:700; }
    nav a{ color:#fff; text-decoration:none; margin-left:25px; font-weight:500; transition:0.3s; }
    nav a:hover{ color:#38bdf8; }
    .hero{ min-height:90vh; display:flex; align-items:center; justify-content:space-between; gap:40px; padding:80px 8%; background:white; flex-wrap:wrap; }
    .hero-text{ flex:1; min-width:300px; }
    .hero-text h1{ font-size:55px; line-height:1.1; margin-bottom:20px; color:#0f172a; }
    .hero-text p{ font-size:18px; color:#475569; margin-bottom:30px; }
    .buttons{ display:flex; gap:15px; flex-wrap:wrap; }
    .btn{ padding:14px 28px; border-radius:10px; text-decoration:none; font-weight:600; transition:0.3s; display:inline-block; }
    .btn-primary{ background:#2563eb; color:white; }
    .btn-secondary{ border:2px solid #2563eb; color:#2563eb; }
    .hero-image{ flex:1; min-width:300px; }
    .hero-image img{ width:100%; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,0.1); }
    section{ padding:80px 8%; }
    footer{ background:#0f172a; color:white; text-align:center; padding:40px 20px; }
    .whatsapp{ position:fixed; bottom:20px; right:20px; background:#25d366; color:white; width:60px; height:60px; border-radius:50%; display:flex; justify-content:center; align-items:center; text-decoration:none; font-size:30px; z-index:999; }
  </style>
</head>
<body>

  <header>
    <div class="logo" style="color: rgb(255, 0, 0);">PERFIL DO ESTUDANTE</div>
    <nav>
      <a href="#inicio" style="color: #73ff00;">INÍCIO</a>
      <a href="#informacoes" style="color: #fbff00;">INFORMAÇÕES</a>
      <a href="perfil.html" style="color: #4169E1;">PERFIL DETALHADO</a> <!-- Link para a nova página -->
      <a href="#contato" style="color: #ffffff;">CONTATO</a>
    </nav>
  </header>

  <section class="hero" id="inicio">
    <div class="hero-text">
      <h1>MARCIEL DE SOUSA BARBOSA</h1>
      <p>ESTUDANTE DE ANÁLISE E DESENVOLVIMENTO DE SISTEMAS...</p>
      <div class="buttons">
        <!-- O LINK ABAIXO AGORA ABRE A PÁGINA DE PERFIL -->
        <a href="perfil.html" class="btn btn-primary">VER PERFIL COMPLETO</a>
        <a href="#informacoes" class="btn btn-secondary">CURRÍCULO</a>
      </div>
    </div>
    <div class="hero-image">
      <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1200" alt="Estudante">
    </div>
  </section>

  <footer>
    <p>© 2026 MARCIEL DE SOUSA BARBOSA</p>
  </footer>

  <a class="whatsapp" href="https://wa.me/5589994638561" target="_blank">☎️</a>

</body>
</html>
